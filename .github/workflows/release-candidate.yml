name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved release version
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish approved release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out release workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Package approved target
        id: package
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $planPath = Join-Path $PWD "release-candidates\$version.json"
          if (-not (Test-Path -LiteralPath $planPath -PathType Leaf)) {
            throw "Approved release plan not found: $planPath"
          }
          $plan = Get-Content -LiteralPath $planPath -Raw | ConvertFrom-Json
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $outputDirectory | Out-Null
          ./scripts/New-ReleaseCandidatePackage.ps1 -Version $version -OutputDirectory $outputDirectory
          ./scripts/Test-ReleaseCandidateAssets.ps1 -AssetDirectory $outputDirectory -Version $version -ExpectedTargetSha $plan.targetSha -ExpectedPrerelease $plan.prerelease -RunSmoke
          "target_sha=$($plan.targetSha)" >> $env:GITHUB_OUTPUT
          "output_directory=$outputDirectory" >> $env:GITHUB_OUTPUT
          "notes_path=$(Join-Path $outputDirectory "sdd-$version-release-notes.md")" >> $env:GITHUB_OUTPUT
          "prerelease=$($plan.prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Reject an existing release or tag
        id: preflight
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release already exists: $version"
          }
          $tag = git ls-remote --tags origin "refs/tags/$version"
          if (-not [string]::IsNullOrWhiteSpace(($tag | Out-String))) {
            throw "Tag already exists: $version"
          }
          "safe_to_cleanup=true" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        id: publish
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $outputDirectory = '${{ steps.package.outputs.output_directory }}'
          $assets = @(
            (Join-Path $outputDirectory "sdd-$version-source.zip"),
            (Join-Path $outputDirectory "sdd-$version-source.zip.sha256"),
            (Join-Path $outputDirectory "sdd-$version-release-manifest.json")
          )
          $releaseArguments = @(
            'release', 'create', $version
          ) + $assets + @(
            '--target', '${{ steps.package.outputs.target_sha }}',
            '--title', "SDD $version",
            '--notes-file', '${{ steps.package.outputs.notes_path }}'
          )
          if ('${{ steps.package.outputs.prerelease }}' -eq 'true') {
            $releaseArguments += '--prerelease'
          }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Download and verify published assets
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'published-assets'
          New-Item -ItemType Directory -Path $downloadDirectory | Out-Null
          gh release download $version --dir $downloadDirectory
          ./scripts/Test-ReleaseCandidateAssets.ps1 `
            -AssetDirectory $downloadDirectory `
            -Version $version `
            -ExpectedTargetSha '${{ steps.package.outputs.target_sha }}' `
            -ExpectedPrerelease ('${{ steps.package.outputs.prerelease }}' -eq 'true') `
            -RunSmoke
          $release = gh release view $version --json tagName,isPrerelease,targetCommitish,url | ConvertFrom-Json
          $expectedPrerelease = '${{ steps.package.outputs.prerelease }}' -eq 'true'
          if ($release.tagName -cne $version -or $release.isPrerelease -ne $expectedPrerelease) {
            throw 'Published GitHub release metadata is invalid.'
          }
          if ($release.targetCommitish -cne '${{ steps.package.outputs.target_sha }}') {
            throw "Release target mismatch: $($release.targetCommitish)"
          }
          "Post-release published-asset smoke: PASS"

      - name: Roll back failed release
        if: failure() && steps.preflight.outputs.safe_to_cleanup == 'true'
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $version --yes --cleanup-tag
          }
          else {
            $tag = git ls-remote --tags origin "refs/tags/$version"
            if (-not [string]::IsNullOrWhiteSpace(($tag | Out-String))) {
              git push origin ":refs/tags/$version"
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to remove orphan release tag: $version"
              }
            }
          }
